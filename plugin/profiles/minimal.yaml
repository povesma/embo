name: minimal
description: Bare bones — no RLM, no ceremony (claude-mem stays on; it is mandatory)

rules:
  code_style:
    line_length: 120
    comments: allowed
    naming_convention: none
  testing:
    approach: none
    scope: []
    subagents: []
  workflow:
    docs_first: off
    correction_capture: false
    scope_drift: off

git:
  commit_style: conventional

tools:
  rlm: false

mcps:
  required: []
  optional: []
