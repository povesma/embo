name: quality
description: Full workflow — docs-first, TDD, RLM + claude-mem

rules:
  code_style:
    line_length: 120
    comments: minimal
    naming_convention: handler
  testing:
    approach: tdd
    scope: [unit, integration]
    subagents: [test-backend, test-review]
  workflow:
    docs_first: strict
    correction_capture: true
    scope_drift: warn

git:
  commit_style: conventional

tools:
  rlm: true

mcps:
  required: [context7]
  optional: [playwright]

doctree:
  models:
    prd: opus
    tech_design: opus
    tasks: sonnet
  escalation: collect
  round_cap: 2
  reviewer_model_family: sonnet
  budget:
    max_agents: 20
