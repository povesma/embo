name: fast
description: Speed mode — test-after, relaxed docs, no corrections

rules:
  code_style:
    line_length: 120
    comments: allowed
    naming_convention: none
  testing:
    approach: test-after
    scope: [unit]
    subagents: []
  workflow:
    docs_first: relaxed
    correction_capture: false
    scope_drift: off
    protected_branches: [main, master]
    protected_branch_mode: block
    branch_task_mode: warn

git:
  commit_style: conventional

tools:
  rlm: true

mcps:
  required: []
  optional: [context7]

doctree:
  models:
    prd: sonnet
    tech_design: sonnet
    tasks: haiku
  escalation: collect
  round_cap: 1
  reviewer_model_family: sonnet
  budget:
    max_agents: 12
